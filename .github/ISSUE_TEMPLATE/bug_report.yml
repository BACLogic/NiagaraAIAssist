name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please don't post site names, addresses, logins or screenshots with customer data. This repo is public.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: And what did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings page
  - type: input
    id: niagara
    attributes:
      label: Niagara version and platform
      placeholder: e.g. N4.15 JACE-9000
